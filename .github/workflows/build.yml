name: Grab Android CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper if Missing
        run: |
          if [ ! -f ./gradlew ]; then
            GV=8.14.3
            if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
              GV=$(sed -nE 's|.*gradle-([0-9]+(\.[0-9]+)*).*|\1|p' gradle/wrapper/gradle-wrapper.properties | head -n1)
              [ -z "$GV" ] && GV=8.14.3
            fi
            echo "Generating wrapper with Gradle $GV"
            mkdir -p /tmp/wrapgen && cd /tmp/wrapgen
            gradle wrapper --gradle-version "$GV"
            cp -a gradle gradlew gradlew.bat "$GITHUB_WORKSPACE/"
            cd "$GITHUB_WORKSPACE"
          fi
          chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Build Signed Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release-keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grab-Release-APK
          path: |
            **/build/outputs/apk/release/*.apk
