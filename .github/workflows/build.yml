name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        run: |
          # If gradlew is missing, generate it using Gradle 8.7 (perfect for AGP 8.5.2)
          if [ ! -f ./gradlew ]; then
            echo "Generating Gradle Wrapper (v8.7)..."
            mkdir -p /tmp/gradle-gen && cd /tmp/gradle-gen
            gradle wrapper --gradle-version 8.7
            cp -a gradle gradlew gradlew.bat "$GITHUB_WORKSPACE/"
            cd "$GITHUB_WORKSPACE"
          fi
          chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-keystore.jks

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release-keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grab-Release-APK
          path: |
            app/build/outputs/apk/release/*.apk
